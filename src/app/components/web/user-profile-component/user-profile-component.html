<div class="card p-4 shadow-sm border-0 bg-light">
  <h4>Perfil del comprador</h4>
  <p><strong>Nombre: </strong>{{user().name}}</p>
  <p><strong>Ciudad de envío: </strong><span [ngClass]="{
  'text-primary': user().city === 'Madrid',
  'text-secondary': user().city === 'Valencia'
  }">{{user().city}}</span></p>
  <p><strong>Tipo de Cuenta: </strong>
    <span class="badge" [class.bg-success]="user().isPremium" [class.bg-secondary]="!user().isPremium">
      {{ user().isPremium ? 'Socio Premium' : 'Usuario normal'}}
    </span>
  </p>
  <div class="d-flex gap-2 mt-3">
    <button class="btn btn-outline-primary btn-sm" (click)="changeCity()">Cambiar de ciudad</button>
    <button class="btn btn-outline-dark btn-sm" (click)="togglePremium()">Alternar tipo de cuenta</button>
  </div>
</div>
