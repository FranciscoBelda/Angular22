<div class="card h-100">
  <img [src]="product().imageUrl" [alt]="product().title" class="card-img-top p-2">
  <div class="card-body">
    <div class="card-title">
      {{product().title}}
    </div>
    <div class="card-text">
      <span class="badge bg-info">{{product().category}}</span>
    </div>
    <div class="card-footer">
      <div class="card-text">
        <div class="text-danger">{{product().price | currency:'EUR'}}</div>
      </div>
    </div>
  </div>
</div>
